name: 📋 Fetch Bot Logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Get Logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== LAST 100 LINES ==="
            tail -100 /opt/priya/bot_run.log
            echo ""
            echo "=== BOT PROCESS ==="
            ps aux | grep priya_bot | grep -v grep
            echo ""
            echo "=== SYSTEM RESOURCES ==="
            free -h && df -h
