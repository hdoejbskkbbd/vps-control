name: 📋 Fetch Bot Logs

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: self-hosted
    steps:
      - name: Get Logs
        run: |
          echo "=== LAST 100 LINES ==="
          tail -100 /opt/priya/bot_run.log
          echo ""
          echo "=== BOT PROCESS ==="
          ps aux | grep priya_bot | grep -v grep
          echo ""
          echo "=== SYSTEM RESOURCES ==="
          free -h && df -h
