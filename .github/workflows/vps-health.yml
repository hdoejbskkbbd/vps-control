name: 💓 VPS Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: self-hosted
    steps:
      - name: VPS Status
        run: |
          echo "=== VPS STATUS ==="
          uptime
          free -h
          df -h
          echo ""
          echo "=== BOT STATUS ==="
          ps aux | grep priya_bot | grep -v grep || echo 'Bot not running'
          echo ""
          echo "=== LAST 20 LOG LINES ==="
          tail -20 /opt/priya/bot_run.log
