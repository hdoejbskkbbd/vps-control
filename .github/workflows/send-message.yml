name: 💬 Send Live Chat Message

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to send to YouTube Live Chat'
        required: true
        default: 'Hello from DRC! 🔥'

jobs:
  send:
    runs-on: self-hosted
    steps:
      - name: Send Message
        run: |
          cd /opt/priya
          source venv/bin/activate
          python3 scripts/send_msg.py "${{ github.event.inputs.message }}"
