name: 💬 Send Live Chat Message

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to send'
        required: true
        default: 'Hello from DRC!'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send Message
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/priya
            source venv/bin/activate
            python3 scripts/send_msg.py "${{ github.event.inputs.message }}"
