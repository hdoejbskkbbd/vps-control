name: 🚀 Bot Deploy (Self-Hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Bot on VPS
        run: |
          cd /opt/priya
          git pull origin main
          bash scripts/restart_bot.sh
          echo "[+] Bot deployed successfully"
